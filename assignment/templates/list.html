<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Assignments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .assignment-card {
            border-left: 5px solid #0d6efd;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .assignment-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }
        .status-badge {
            font-size: 0.85rem;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="mb-4 text-primary">Class Assignments</h2>
    
    <div class="row g-4">
        {% for assignment in assignments %}
        <div class="col-md-6">
            <div class="card assignment-card h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ assignment.title }}</h5>
                    <p class="card-text text-muted">{{ assignment.description|truncatewords:20 }}</p>
                    <p class="small text-danger">Due: {{ assignment.due_date|date:"M d, Y H:i" }}</p>
                    <button class="btn btn-outline-primary btn-sm open-submit-modal" 
                            data-bs-toggle="modal" 
                            data-bs-target="#submissionModal" 
                            data-id="{{ assignment.id }}" 
                            data-title="{{ assignment.title }}">
                        Submit Work
                    </button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<div class="modal fade" id="submissionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Submit Assignment</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="assignmentForm" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-body">
                    <div id="alertContainer"></div>
                    <div class="mb-3">
                        <label for="submission_text" class="form-label">Submission Notes</label>
                        <textarea class="form-control" id="submission_text" name="submission_text" rows="4" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="file_upload" class="form-label">Attach File (Optional)</label>
                        <input class="form-control" type="file" id="file_upload" name="file_upload">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <span class="spinner-border spinner-border-sm d-none" id="btnSpinner" role="status"></span>
                        Submit
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const submissionModal = document.getElementById('submissionModal');
    const assignmentForm = document.getElementById('assignmentForm');
    const alertContainer = document.getElementById('alertContainer');
    const submitBtn = document.getElementById('submitBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    let activeAssignmentId = null;

    submissionModal.addEventListener('show.bs.modal', (event) => {
        const button = event.relatedTarget;
        activeAssignmentId = button.getAttribute('data-id');
        const title = button.getAttribute('data-title');
        document.getElementById('modalTitle').textContent = `Submit: ${title}`;
        alertContainer.innerHTML = '';
        assignmentForm.reset();
    });

    assignmentForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        submitBtn.disabled = true;
        btnSpinner.classList.remove('d-none');
        alertContainer.innerHTML = '';

        const formData = new FormData(assignmentForm);

        try {
            const response = await fetch(`/assignments/submit/${activeAssignmentId}/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                },
                body: formData
            });

            const data = await response.json();

            if (response.ok && data.status === 'success') {
                alertContainer.innerHTML = `
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        ${data.message} Submitted on ${data.submitted_at}
                    </div>`;
                setTimeout(() => {
                    bootstrap.Modal.getInstance(submissionModal).hide();
                }, 1500);
            } else {
                throw new Error(data.message || 'Submission failed.');
            }
        } catch (error) {
            alertContainer.innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    ${error.message}
                </div>`;
        } finally {
            submitBtn.disabled = false;
            btnSpinner.classList.add('d-none');
        }
    });
});
</script>
</body>
</html>
