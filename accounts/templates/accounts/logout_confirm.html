{% extends 'base.html' %}
{% block title %}Logout Confirmation | Nexus One Academy{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card shadow">
      <div class="card-body text-center">
        <h2 class="card-title mb-4">Are you sure you want to logout?</h2>
        <p class="card-text text-muted mb-4">You will be logged out of your account.</p>
        
        <form method="post" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, Logout</button>
          <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
